#
# SvxReflector test configuration for Admin API testing
#

[GLOBAL]
# Reflector settings - use non-standard ports to avoid conflicts
LISTEN_PORT=15300
SQL_TIMEOUT=600
SQL_TIMEOUT_BLOCKTIME=60

# HTTP Status API
HTTP_SRV_PORT=18080

# Admin API settings
ADMIN_API_TOKEN=test-token-12345
ADMIN_MUTE_FILE=/var/lib/svxlink/mutelist.json

# Logging
TIMESTAMP_FORMAT="%Y-%m-%d %H:%M:%S"

# Use default ham radio callsign format
# ACCEPT_CALLSIGN=.*

# Server certificate settings for PKI (required even if not using TLS)
[SERVER_CERT]
COMMON_NAME=test-reflector

[USERS]
# Test users (password = callsign for simplicity)
# Format: CALLSIGN=password
